<!DOCTYPE html>
<html lang="en">

<body>
<div id="times" class="panel">
  <div><b>Lap</b><span id="lapNo">1</span></div>
  <div><b>Current</b><span id="cur">-</span></div>
  <div><b>Last</b><span id="last">-</span></div>
  <div><b>Best</b><span id="best">-</span></div>
  <div><b>Sectors</b><span id="sec">-</span></div>

</div>
<div id="help" class="panel">W / Up: throttle<br>S / Down: brake<br>A D / Left Right: steer<br>R: back on track</div>

  <div id="lights"></div>
  <div id="row"><div id="speed">0</div><div id="unit">km/h</div><div id="gear">N</div></div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- Scene ---------- */
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xc4d9ec,300,1900);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
document.body.appendChild(renderer.domElement);
scene.environment=new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(),0.04).texture; // realistic reflections
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,0.5,3500);
scene.add(new THREE.HemisphereLight(0xcfe4ff,0x5a7a43,0.55));
const sun=new THREE.DirectionalLight(0xfff1d6,2.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-0.0004;
const sc=sun.shadow.camera;sc.left=sc.bottom=-50;sc.right=sc.top=50;sc.near=10;sc.far=400;
const sunDir=new THREE.Vector3(0.5,0.8,0.35).normalize();
scene.add(sun,sun.target);
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{sd:{value:sunDir}},
  vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader:'varying vec3 p;uniform vec3 sd;void main(){float h=clamp(p.y,0.,1.);vec3 c=mix(vec3(.77,.85,.93),vec3(.16,.40,.78),pow(h,.55));float s=max(dot(p,sd),0.);c+=vec3(1.,.85,.6)*(pow(s,600.)*2.+pow(s,12.)*.18);gl_FragColor=vec4(c,1.);}'
}));
scene.add(sky);
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

function noiseTex(r,g,b,amp,rep,blots){
  const cv=document.createElement('canvas');cv.width=cv.height=256;const x=cv.getContext('2d');
  const id=x.createImageData(256,256);
  for(let i=0;i<id.data.length;i+=4){const n=(Math.random()-.5)*amp;id.data[i]=r+n;id.data[i+1]=g+n;id.data[i+2]=b+n;id.data[i+3]=255;}
  x.putImageData(id,0,0);
  for(let i=0;i<blots;i++){x.fillStyle='rgba('+(Math.random()<.5?'0,0,0':'255,255,200')+',0.06)';x.beginPath();x.arc(Math.random()*256,Math.random()*256,10+Math.random()*30,0,7);x.fill();}
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
const ground=new THREE.Mesh(new THREE.PlaneGeometry(7000,7000),new THREE.MeshStandardMaterial({map:noiseTex(70,125,52,40,600,50),roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-0.05;ground.receiveShadow=true;
scene.add(ground);

/* ---------- Track (original fictional circuit) ---------- */
const S=1.5, W=14, N=900;
const ctrl=[[0,0],[0,200],[0,400],[40,520],[140,580],[260,560],[330,480],[320,380],[250,320],
  [260,230],[360,170],[480,190],[540,100],[480,-20],[360,-60],[250,-40],[170,-120],[60,-140]];
const curve=new THREE.CatmullRomCurve3(ctrl.map(p=>new THREE.Vector3(p[0]*S,0,p[1]*S)),true,'centripetal');
const C=[],T=[],Nn=[];
for(let i=0;i<N;i++){
  const t=i/N,p=curve.getPointAt(t),tg=curve.getTangentAt(t);
  C.push(p);T.push(tg);Nn.push(new THREE.Vector3(tg.z,0,-tg.x)); // left normal
}
function strip(o1,o2,y,colorFn,tex){
  const pos=[],col=[],uv=[],idx=[],ds=curve.getLength()/N;
  for(let i=0;i<=N;i++){
    const k=i%N,c=colorFn(i);
    for(const o of [o1,o2]){
      pos.push(C[k].x+Nn[k].x*o,y,C[k].z+Nn[k].z*o);
      col.push(c.r,c.g,c.b);uv.push(o===o1?0:Math.abs(o1-o2)/12,i*ds/12);
    }
    if(i<N){const a=i*2;idx.push(a,a+1,a+2,a+1,a+3,a+2);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);g.computeVertexNormals();
  const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,map:tex||null,roughness:.9,side:THREE.DoubleSide}));
  mesh.receiveShadow=true;scene.add(mesh);return mesh;
}
const asphalt=[new THREE.Color(0x55575f),new THREE.Color(0x4a4c53)];
const road=strip(W/2,-W/2,0.02,i=>asphalt[Math.floor(i/6)%2],noiseTex(200,200,206,70,1,40));

// ---- YOUR ASSET FILES: put them in an "assets" folder next to index.html ----
const ASSETS={
  grass:'assets/grass.jpg',         // a SHEET of grass blades on black: used to make 3D grass tufts (see GRASS_SPRITES)
  asphalt:'assets/asphalt.jpg', useAsphalt:false, asphaltTile:12, // set useAsphalt:true ONLY for a seamless asphalt photo
  colormap:'assets/colormap.png',   // colour palette that belongs to car.glb
  car:'assets/car_future.glb', carLength:5.5,
  carRotY:0                         // use Math.PI if the car model drives backwards
};
// Pixel boxes [left, top, right, bottom] of each plant on the 1024x1024 grass sheet, and its height in metres
const GRASS_SPRITES=[
  [[45,425,195,560],0.8],[[285,410,475,555],0.9],[[548,365,738,565],1.0],[[795,325,962,565],1.1],
  [[45,695,178,1012],1.3],[[712,680,890,1012],1.3]
];
if(ASSETS.useAsphalt){
  new THREE.TextureLoader().load(ASSETS.asphalt,t=>{
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(12/ASSETS.asphaltTile,12/ASSETS.asphaltTile);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
    road.material.map=t;road.material.vertexColors=false;road.material.color.set(0xdddddd);road.material.needsUpdate=true;
  },undefined,()=>console.warn('Missing '+ASSETS.asphalt));
}
const grassImg=new Image();
grassImg.onload=()=>buildGrass(grassImg);
grassImg.onerror=()=>console.warn('Missing '+ASSETS.grass+' - no 3D grass.');
grassImg.src=ASSETS.grass;

function buildGrass(img){
  const IW=img.width,IH=img.height,cv=document.createElement('canvas');cv.width=IW;cv.height=IH;
  const cx=cv.getContext('2d');cx.drawImage(img,0,0);
  const d=cx.getImageData(0,0,IW,IH);
  for(let i=0;i<d.data.length;i+=4){                     // black background -> transparent
    d.data[i+3]=clamp((Math.max(d.data[i],d.data[i+1],d.data[i+2])-14)*12,0,255);
  }
  cx.putImageData(d,0,0);
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;tex.anisotropy=8;
  const mat=new THREE.MeshStandardMaterial({map:tex,alphaTest:0.45,side:THREE.DoubleSide,roughness:1,metalness:0});
  // one tuft = two crossed upright planes showing one plant from the sheet
  const tuftGeo=([x0,y0,x1,y1],h)=>{
    const w=h*(x1-x0)/(y1-y0),u0=x0/IW,u1=x1/IW,v0=1-y1/IH,v1=1-y0/IH,pos=[],uv=[],idx=[];
    [0,Math.PI/2].forEach((a,k)=>{
      const px=Math.cos(a)*w/2,pz=Math.sin(a)*w/2;
      pos.push(-px,0,-pz, px,0,pz, px,h,pz, -px,h,-pz);
      uv.push(u0,v0,u1,v0,u1,v1,u0,v1);
      idx.push(k*4,k*4+1,k*4+2,k*4,k*4+2,k*4+3);
    });
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
    g.setAttribute('normal',new THREE.Float32BufferAttribute(Array.from({length:24},(_,i)=>i%3===1?1:0),3)); // light from above
    g.setIndex(idx);return g;
  };
  const spots=GRASS_SPRITES.map(()=>[]);
  const minD2=(W/2+1.8)**2;
  for(let i=0;i<N;i++)for(const side of [1,-1])for(let n=0;n<3;n++){
    const o=side*(W/2+1.8+Math.pow(Math.random(),1.6)*28),j=(Math.random()-.5)*3;
    const x=C[i].x+Nn[i].x*o+T[i].x*j,z=C[i].z+Nn[i].z*o+T[i].z*j;
    let ok=true;
    for(let q=0;q<N;q+=3){const dx=x-C[q].x,dz=z-C[q].z;if(dx*dx+dz*dz<minD2){ok=false;break;}}
    if(ok)spots[Math.floor(Math.random()*spots.length)].push([x,z]);
  }
  const m4=new THREE.Matrix4(),q4=new THREE.Quaternion(),yA=new THREE.Vector3(0,1,0);
  GRASS_SPRITES.forEach(([rect,h],k)=>{
    const list=spots[k],mesh=new THREE.InstancedMesh(tuftGeo(rect,h),mat,list.length);
    list.forEach(([x,z],n)=>{
      const sc=0.7+Math.random()*0.8;
      q4.setFromAxisAngle(yA,Math.random()*6.28);
      m4.compose(new THREE.Vector3(x,0,z),q4,new THREE.Vector3(sc,sc,sc));
      mesh.setMatrixAt(n,m4);
      mesh.setColorAt(n,new THREE.Color().setHSL(0.22+Math.random()*0.08,0.25,0.75+Math.random()*0.25));
    });
    scene.add(mesh);
  });
}
const red=new THREE.Color(0xd8281e),wht=new THREE.Color(0xf2f2f2),line=new THREE.Color(0xffffff);
strip(W/2+1.2,W/2,0.03,i=>Math.floor(i/3)%2?red:wht);
strip(-W/2,-W/2-1.2,0.03,i=>Math.floor(i/3)%2?red:wht);
strip(W/2-0.2,W/2-0.45,0.035,()=>line);
strip(-W/2+0.45,-W/2+0.2,0.035,()=>line);
const startLine=new THREE.Mesh(new THREE.BoxGeometry(W,0.04,1.6),new THREE.MeshStandardMaterial({color:0xffffff}));
startLine.position.set(C[0].x,0.04,C[0].z);startLine.rotation.y=Math.atan2(T[0].x,T[0].z);
scene.add(startLine);
{
  const gm=new THREE.MeshStandardMaterial({color:0x22252b}),g=new THREE.Group();
  for(const s of [1,-1]){const p=new THREE.Mesh(new THREE.BoxGeometry(0.6,7,0.6),gm);p.position.set(s*(W/2+1.5),3.5,0);p.castShadow=true;g.add(p);}
  const beam=new THREE.Mesh(new THREE.BoxGeometry(W+3.6,1.4,0.8),new THREE.MeshStandardMaterial({color:0x1b4fd8}));
  beam.position.set(0,7,0);beam.castShadow=true;g.add(beam);
  g.position.set(C[0].x,0,C[0].z);g.rotation.y=Math.atan2(T[0].x,T[0].z);scene.add(g);
}
{
  const bar=new THREE.InstancedMesh(new THREE.BoxGeometry(0.5,1.1,5),new THREE.MeshStandardMaterial({color:0xffffff}),N);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),yAxis=new THREE.Vector3(0,1,0),one=new THREE.Vector3(1,1,1);let n=0;
  for(let i=0;i<N;i+=2){
    q.setFromAxisAngle(yAxis,Math.atan2(T[i].x,T[i].z));
    for(const s of [1,-1]){
      const o=s*(W/2+9);
      m4.compose(new THREE.Vector3(C[i].x+Nn[i].x*o,0.55,C[i].z+Nn[i].z*o),q,one);
      bar.setMatrixAt(n,m4);bar.setColorAt(n++,(i/2)%2?red:wht);
    }
  }
  bar.count=n;bar.receiveShadow=true;bar.castShadow=true;scene.add(bar);
}

// scenery for a sense of speed
{
  const trees=new THREE.InstancedMesh(new THREE.ConeGeometry(4,14,6),
    new THREE.MeshStandardMaterial({color:0xffffff,flatShading:true}),450);trees.castShadow=true;
  const m4=new THREE.Matrix4();let n=0,tries=0;
  while(n<450&&tries<6000){
    tries++;
    const x=400+(Math.random()-.5)*2600,z=330+(Math.random()-.5)*2600;
    let ok=true;
    for(let i=0;i<N;i+=3){const dx=x-C[i].x,dz=z-C[i].z;if(dx*dx+dz*dz<1600){ok=false;break;}}
    if(!ok)continue;
    const sz=0.7+Math.random()*1.1;m4.compose(new THREE.Vector3(x,7*sz,z),new THREE.Quaternion(),new THREE.Vector3(sz,sz,sz));
    trees.setMatrixAt(n,m4);trees.setColorAt(n++,new THREE.Color().setHSL(0.27+Math.random()*0.06,0.45,0.2+Math.random()*0.12));
  }
  trees.count=n;scene.add(trees);
}

let hint=0;
function nearest(x,z,full){
  let best=1e18,bi=hint;
  const from=full?0:-25,to=full?N-1:25;
  for(let j=from;j<=to;j++){
    const k=full?j:(hint+j+N)%N,dx=x-C[k].x,dz=z-C[k].z,d=dx*dx+dz*dz;
    if(d<best){best=d;bi=k;}
  }
  hint=bi;return bi;
}

/* ---------- Car model (fictional livery) ---------- */
const carMesh=new THREE.Group();
const paint=new THREE.MeshPhysicalMaterial({color:0x1b4fd8,metalness:.6,roughness:.28,clearcoat:1,clearcoatRoughness:.05});
const accent=new THREE.MeshStandardMaterial({color:0xff7a1a});
const dark=new THREE.MeshStandardMaterial({color:0x15161a});
const box=(w,h,d,m,x,y,z)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);carMesh.add(o);return o;};
box(0.7,0.4,3.6,paint,0,0.5,0.3);
box(1.5,0.32,1.5,paint,0,0.42,-0.1);
box(2.0,0.07,0.5,accent,0,0.2,2.7);
box(1.1,0.55,0.12,accent,0,0.95,-2.1);
box(0.1,0.45,0.1,dark,0,0.72,-2.0);
const helmet=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),new THREE.MeshStandardMaterial({color:0xffd23a}));
helmet.position.set(0,0.82,0.1);carMesh.add(helmet);
const wheels=[];
const wGeo=new THREE.CylinderGeometry(0.36,0.36,0.4,18);wGeo.rotateZ(Math.PI/2);
for(const [x,z,front] of [[-0.85,1.98,1],[0.85,1.98,1],[-0.85,-1.62,0],[0.85,-1.62,0]]){
  const pivot=new THREE.Group();pivot.position.set(x,0.36,z);
  const w=new THREE.Mesh(wGeo,dark);pivot.add(w);carMesh.add(pivot);
  wheels.push({pivot,w,front});
}
{
  const nose=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.3,1.8,14).rotateX(Math.PI/2),paint);
  nose.position.set(0,0.38,2.3);carMesh.add(nose);
  box(0.35,0.4,0.8,paint,0,0.85,-0.7);
  box(1.6,0.05,3.8,dark,0,0.12,-0.1);
  box(1.52,0.05,1.0,accent,0,0.6,-0.1);
  box(0.04,0.3,0.04,dark,0,0.85,0.6);
  for(const s of [1,-1]){
    box(0.04,0.04,0.7,dark,s*0.22,0.98,0.25);
    box(0.05,0.25,0.5,accent,s*1.0,0.3,2.7);
    box(0.05,0.6,0.5,accent,s*0.58,0.95,-2.1);
  }
  for(const w of wheels){
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.42,12),new THREE.MeshStandardMaterial({color:0xb8bcc4,metalness:.8,roughness:.3}));
    rim.rotation.z=Math.PI/2;w.w.add(rim);
    w.w.add(new THREE.Mesh(new THREE.BoxGeometry(0.44,0.05,0.34),accent));
  }
  carMesh.traverse(o=>{if(o.isMesh)o.castShadow=true;});
}
scene.add(carMesh);
new GLTFLoader().load(ASSETS.car,gltf=>{
  const m=gltf.scene,w=new THREE.Group();w.add(m);m.rotation.y=ASSETS.carRotY;
  let b=new THREE.Box3().setFromObject(w);const sz=b.getSize(new THREE.Vector3());
  m.scale.setScalar(ASSETS.carLength/Math.max(sz.x,sz.y,sz.z));          // fit to the real car length
  b=new THREE.Box3().setFromObject(w);const ctr=b.getCenter(new THREE.Vector3());
  m.position.set(-ctr.x,-b.min.y,-ctr.z);                                // centre it, wheels on the ground
  w.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  carMesh.children.forEach(o=>o.visible=false);carMesh.add(w);
  new THREE.TextureLoader().load(ASSETS.colormap,cm=>{          // paint the car with its colour palette
    cm.flipY=false;cm.colorSpace=THREE.SRGBColorSpace;          // glTF models expect an un-flipped texture
    cm.magFilter=cm.minFilter=THREE.NearestFilter;cm.generateMipmaps=false; // keep the palette squares crisp
    w.traverse(o=>{if(o.isMesh)for(const mt of [].concat(o.material)){mt.map=cm;mt.color.set(0xffffff);mt.metalness=0.2;mt.roughness=0.5;mt.needsUpdate=true;}});
  },undefined,()=>console.warn('Missing '+ASSETS.colormap));           // hide the built-in car
},undefined,()=>console.warn('No car model at '+ASSETS.car+' - using the built-in car.'));

/* ---------- Physics ---------- */
const G=9.81,M=800,A=1.98,B=1.62,L=A+B,IZ=1500;
// STEERING TUNING - change these numbers to taste
const TUNE={
  lockBase:0.06, lockLow:0.34, falloff:15, // wheel angle: lockBase at top speed, plus lockLow when slow (halves at 'falloff' m/s)
  rate:4.5,        // how fast a key press turns the wheel; bigger = quicker
  slipAllow:0.14,  // extra wheel angle (rad) the tyres may use beyond the "no-slip" angle; bigger = sharper but slides more
  yawAssist:5      // how hard the car is nudged to rotate at the rate you asked for; 0 = off, bigger = snappier, harder to spin
};
const steerMax=v=>TUNE.lockBase+TUNE.lockLow/(1+(v/TUNE.falloff)**2);   // CG sits 45% from the front axle
const GR=[0,3.0,2.45,2.05,1.75,1.5,1.3,1.13,1.0],FD=5.74,RW=0.36,ETA=0.92,IDLE=4500,MAXRPM=15000;
const torque=r=>620*Math.max(0.3,1-((r-11500)/7500)**2);   // ~780 kW peak
const car={x:0,z:0,psi:0,vx:0,vy:0,r:0,steer:0,thr:0,brk:0,gear:1,rpm:IDLE,shift:0,mu:2,grass:false,d:0,idx:0};
const keys={};
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();
  if(e.code==='KeyR')resetCar(true);
});
addEventListener('keyup',e=>keys[e.code]=false);

function resetCar(invalidate){
  const k=invalidate?nearest(car.x,car.z,true):0;
  car.x=C[k].x;car.z=C[k].z;car.psi=Math.atan2(T[k].x,T[k].z);
  car.vx=car.vy=car.r=0;car.gear=1;car.thr=car.brk=car.steer=0;
  if(invalidate&&lapStart!==null)lapValid=false;
}

function step(dt){
  const c=car,v=Math.hypot(c.vx,c.vy);
  const up=keys.KeyW||keys.ArrowUp,dn=keys.KeyS||keys.ArrowDown;
  const lf=keys.KeyA||keys.ArrowLeft,rt=keys.KeyD||keys.ArrowRight;

  // driver inputs (keyboard smoothing)
  c.thr+=((up?1:0)-c.thr)*Math.min(1,dt*10);
  c.brk+=((dn?1:0)-c.brk)*Math.min(1,dt*14);
  const tgt=(lf?1:0)-(rt?1:0);
  const rate=(tgt===0||Math.sign(tgt)!==Math.sign(c.steer))?7:TUNE.rate/(1+v/60);
  c.steer+=clamp(tgt-c.steer,-rate*dt,rate*dt);
  const ayMax=c.mu*(M*G+2.3*v*v)/M,dg=L*ayMax/Math.max(v*v,25)+TUNE.slipAllow;
  const dl=c.dl=clamp(c.steer*steerMax(v),-dg,dg);            // less lock at speed

  // engine + automatic gearbox
  const rpmAt=()=>Math.max(IDLE,Math.max(c.vx,0)/RW*GR[c.gear]*FD*9.5493);
  let rpm=rpmAt();
  if(c.shift>0)c.shift-=dt;
  else if(rpm>14300&&c.gear<8){c.gear++;c.shift=0.06;}
  else if(rpm<7800&&c.gear>1){c.gear--;c.shift=0.06;}
  rpm=c.rpm=rpmAt();
  const drive=(c.shift>0||rpm>=MAXRPM)?0:c.thr*torque(rpm)*GR[c.gear]*FD*ETA/RW;

  // vertical loads: weight + aero downforce (grows with v^2)
  const down=2.3*v*v,mg=M*G;
  const Fzf=mg*B/L+0.45*down,Fzr=mg*A/L+0.55*down;
  const limF=c.mu*Fzf,limR=c.mu*Fzr;

  // tyre slip angles and lateral forces
  const vxs=Math.max(c.vx,1);
  const af=dl-Math.atan2(c.vy+A*c.r,vxs),ar=-Math.atan2(c.vy-B*c.r,vxs);
  const lowF=clamp((c.vx-1)/5,0,1);
  let Fyf=limF*Math.sin(1.4*Math.atan(11*af))*lowF;
  let Fyr=limR*1.25*Math.sin(1.4*Math.atan(11*ar))*lowF;

  // longitudinal forces: 58/42 brake bias, rear drive, friction circle per axle
  const moving=c.vx>0.3?1:0;
  const Fb=c.brk*moving*42000;
  let Fxf=clamp(-Fb*0.58,-limF,limF),Fxr=clamp(drive-Fb*0.42,-0.7*limR,0.55*limR);
  Fyf*=Math.sqrt(Math.max(0,1-(Fxf/limF)**2));
  Fyr*=Math.sqrt(Math.max(0,1-(Fxr/limR)**2));

  // drag, rolling resistance, grass
  const gr=c.grass?0.35*M:0;
  const Fdx=-0.95*v*c.vx-120*moving-gr*c.vx;
  const Fdy=-0.95*v*c.vy-gr*c.vy;

  const cs=Math.cos(dl),sn=Math.sin(dl);
  const Fx=Fxr+Fxf*cs-Fyf*sn+Fdx;
  const Fy=Fyr+Fyf*cs+Fxf*sn+Fdy;
  c.vx+=(Fx/M+c.r*c.vy)*dt;
  c.vy+=(Fy/M-c.r*c.vx)*dt;
  const aw=clamp((c.vx-2)/4,0,1),rMax=0.95*ayMax/Math.max(c.vx,5),rT=clamp(c.vx*Math.tan(dl)/L,-rMax,rMax);
  c.r+=((A*(Fyf*cs+Fxf*sn)-B*Fyr)/IZ+TUNE.yawAssist*(rT-c.r)*aw)*dt;
  if(c.vx<0)c.vx*=1-dt*4;
  if(Math.abs(c.vx)<0.5&&c.thr<0.05)c.vx*=1-dt*3;
  c.psi+=c.r*dt;
  const sp=Math.sin(c.psi),co=Math.cos(c.psi);
  c.x+=(c.vx*sp+c.vy*co)*dt;
  c.z+=(c.vx*co-c.vy*sp)*dt;
}

/* ---------- Timing ---------- */
let lapStart=null,lapValid=true,lapNo=1,best=null,lastLap=null,prevIdx=0,curSec=0,secStart=null;
const secT=[null,null,null];
const fmt=ms=>ms==null?'-':`${Math.floor(ms/60000)}:${String(Math.floor(ms/1000)%60).padStart(2,'0')}.${String(Math.floor(ms%1000)).padStart(3,'0')}`;

function updateTrackState(now){
  const c=car,k=nearest(c.x,c.z);
  c.idx=k;
  c.d=(c.x-C[k].x)*Nn[k].x+(c.z-C[k].z)*Nn[k].z;
  const out=Math.abs(c.d)>W/2+1.2;
  c.grass=out;c.mu=out?0.7:2.0;
  const lim=W/2+9;
  if(Math.abs(c.d)>lim){                       // barrier contact
    const s=Math.sign(c.d),push=Math.abs(c.d)-lim;
    c.x-=Nn[k].x*s*push;c.z-=Nn[k].z*s*push;
    c.vx*=0.85;c.vy*=0.85;c.r*=0.85;if(lapStart!==null)lapValid=false;
  }
  if(out&&lapStart!==null)lapValid=false;
  if(lapStart===null&&c.vx>1){lapStart=secStart=now;}
  if(lapStart===null){prevIdx=k;return;}
  if(prevIdx>N*0.8&&k<N*0.2){                    // crossed the line
    secT[2]=now-secStart;secStart=now;curSec=0;
    if(lapValid){lastLap=now-lapStart;if(best===null||lastLap<best)best=lastLap;}
    lapNo++;lapStart=now;lapValid=true;
  }
  const sec=Math.floor(k/(N/3));
  if(sec!==curSec){if(sec===curSec+1){secT[curSec]=now-secStart;secStart=now;}curSec=sec;}
  prevIdx=k;
}

/* ---------- HUD ---------- */
const lightsEl=document.getElementById('lights'),lights=[];
for(let i=0;i<15;i++){lights.push(lightsEl.appendChild(document.createElement('i')));}
const lightCol=i=>i<5?'#34d27b':i<10?'#ff3b30':'#3aa0ff';
const $=id=>document.getElementById(id);
function updateHud(now){
  $('speed').textContent=Math.max(0,Math.round(car.vx*3.6));
  $('gear').textContent=car.vx<1?'N':car.gear;
  const lit=clamp(Math.floor((car.rpm-9000)/6000*15),0,15);
  lights.forEach((l,i)=>l.style.background=i<lit?lightCol(i):'#2a2d36');
  $('lapNo').textContent=lapNo;
  $('cur').textContent=lapStart===null?'Cross the line to start':fmt(now-lapStart);
  $('last').textContent=fmt(lastLap);$('best').textContent=fmt(best);
  $('sec').textContent=secT.map(fmt).join('  ');
  $('warn').textContent=!lapValid?'Track limits - lap deleted':'';
}

/* ---------- Visuals + loop ---------- */
let camPsi=0,wheelSpin=0;
function updateVisuals(dt){
  carMesh.position.set(car.x,0,car.z);
  carMesh.rotation.y=car.psi;
  const v=Math.hypot(car.vx,car.vy);
  wheelSpin+=car.vx*dt/RW;
  const dl=car.dl||0;
  for(const w of wheels){w.w.rotation.x=wheelSpin;if(w.front)w.pivot.rotation.y=dl;}
  let da=car.psi-camPsi;da=Math.atan2(Math.sin(da),Math.cos(da));
  camPsi+=da*Math.min(1,dt*6);
  const dx=Math.sin(camPsi),dz=Math.cos(camPsi),back=8+v*0.03;
  camera.position.set(car.x-dx*back,3.2+v*0.01,car.z-dz*back);
  camera.lookAt(car.x+dx*10,1.0,car.z+dz*10);
  camera.fov=62+v*0.15;camera.updateProjectionMatrix();
  sky.position.copy(camera.position);
  sun.position.set(car.x+sunDir.x*150,sunDir.y*150,car.z+sunDir.z*150);
  sun.target.position.set(car.x,0,car.z);
}

resetCar(false);camPsi=car.psi;
let prev=performance.now(),acc=0;
function frame(t){
  const dt=Math.min(0.05,(t-prev)/1000);prev=t;acc+=dt;
  updateTrackState(t);
  while(acc>=1/240){step(1/240);acc-=1/240;}
  updateVisuals(dt);updateHud(t);
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
